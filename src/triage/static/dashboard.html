<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-triage</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --ok: #2f7d4f; --warn: #b7791f; --bad: #c0392b; --bar: #3b6fb6; --queue: #d99a2b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a998f; --line: #34342f;
      --ok: #5cbf83; --warn: #e0a84a; --bad: #e46b5e; --bar: #6b9be0; --queue: #e0a84a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 28px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
          padding: 2px 10px; font-family: var(--mono); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card h3 { margin: 0 0 2px; font-size: 16px; display: flex; justify-content: space-between; }
  .muted { color: var(--muted); }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: #fff; }
  .closed { background: var(--ok); } .half_open { background: var(--warn); } .open { background: var(--bad); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; margin: 10px 0 6px; }
  .bar span { display: block; height: 100%; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; font-family: var(--mono); }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  td.reason { color: var(--muted); min-width: 260px; }
  .o-success { color: var(--ok); } .o-shed, .o-failed, .o-error { color: var(--bad); }
  .o-pending { color: var(--warn); }
  #err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>llm-triage</h1>
    <div class="chips" id="chips"></div>
    <span id="err"></span>
  </header>
  <h2>Backends</h2>
  <div class="grid" id="backends"></div>
  <h2>Recent routing decisions</h2>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>#</th><th>priority</th><th>difficulty</th><th>need</th><th>backend</th>
        <th>outcome</th><th>latency</th><th>why</th>
      </tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </div>
</main>
<script>
const el = (tag, props = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") node.textContent = v; else if (k === "style") node.style.cssText = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
};
const fmt = (x, digits = 2) => (x === null || x === undefined) ? "-" : Number(x).toFixed(digits);

function chips(s) {
  const host = s.host;
  return [
    `strategy ${s.strategy}`,
    `fleet util ${fmt(s.utilization)}`,
    `cpu ${fmt(host.cpu_percent, 0)}%`,
    `ram free ${fmt(host.ram_available_mb / 1024, 1)} GB`,
    `pressure ${fmt(host.pressure)}`,
    `shed ${Object.values(s.shed).reduce((a, b) => a + b, 0)}`,
  ].map(t => el("span", { class: "chip", text: t }));
}

function backendCard(b) {
  const cap = b.max_concurrency;
  const run = Math.min(100, 100 * b.inflight / cap);
  const wait = Math.min(100 - run, 100 * b.queued / cap);
  return el("div", { class: "card" }, [
    el("h3", {}, [el("span", { text: b.name }), el("span", { class: `badge ${b.breaker}`, text: b.breaker.replace("_", "-") })]),
    el("div", { class: "muted", text: `tier ${b.tier} - ${b.model}${b.local ? "" : " - remote"}` }),
    el("div", { class: "bar", title: "running / queued vs capacity" }, [
      el("span", { style: `width:${run}%;background:var(--bar)` }),
      el("span", { style: `width:${wait}%;background:var(--queue)` }),
    ]),
    el("dl", {}, [
      el("dt", { text: "running / queued" }), el("dd", { text: `${b.inflight}/${cap} + ${b.queued}` }),
      el("dt", { text: "latency ewma / p95" }), el("dd", { text: `${fmt(b.ewma_latency_s)}s / ${fmt(b.p95_latency_s)}s` }),
      el("dt", { text: "ms per token" }), el("dd", { text: fmt(b.s_per_token * 1000, 1) }),
      el("dt", { text: "ok / failed" }), el("dd", { text: `${b.successes} / ${b.failures}` }),
      el("dt", { text: "cost" }), el("dd", { text: `$${fmt(b.cost_usd, 4)}` }),
    ]),
  ]);
}

function decisionRow(d) {
  return el("tr", {}, [
    el("td", { class: "num", text: d.id }),
    el("td", { text: d.priority }),
    el("td", { class: "num", text: fmt(d.difficulty) }),
    el("td", { class: "num", text: d.required_tier }),
    el("td", { text: d.backend || "-" }),
    el("td", { class: `o-${d.outcome}`, text: d.outcome }),
    el("td", { class: "num", text: d.latency_s === null ? "-" : `${fmt(d.latency_s)}s` }),
    el("td", { class: "reason", text: d.reason + (d.attempts.length ? ` | fallbacks: ${d.attempts.join("; ")}` : "") }),
  ]);
}

async function refresh() {
  try {
    const res = await fetch("/triage/status?limit=30", { cache: "no-store" });
    const s = await res.json();
    document.getElementById("chips").replaceChildren(...chips(s));
    document.getElementById("backends").replaceChildren(...s.backends.map(backendCard));
    document.getElementById("recent").replaceChildren(...s.recent.map(decisionRow));
    document.getElementById("err").textContent = "";
  } catch (e) {
    document.getElementById("err").textContent = "router unreachable";
  }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
