# Local models first, a paid cloud model for overflow and for when the laptop is busy.
#
# The cloud backend can be any OpenAI-compatible API. Put its key in an
# environment variable and name that variable in api_key_env:
#
#   export CLOUD_API_KEY=...        (PowerShell: $env:CLOUD_API_KEY = "...")
#   triage serve -c examples/hybrid.yaml
#
# Because the cloud backend has local: false, host CPU/RAM pressure never
# penalises it, while cost_per_1k_tokens keeps it from being used for everything.

port: 8080

policy:
  latency_slo_s: 10
  cost_ref_usd: 0.01         # a request costing $0.01 costs one point in the score
  weights:
    cost: 1.0

backends:
  - name: local-small
    url: http://127.0.0.1:11434/v1
    model: qwen2.5:0.5b
    tier: 1
    max_concurrency: 4
    weight: 0.2
    prior_s_per_token: 0.006

  - name: local-medium
    url: http://127.0.0.1:11434/v1
    model: qwen2.5:3b
    tier: 2
    max_concurrency: 2
    weight: 0.5
    prior_s_per_token: 0.015

  - name: cloud
    url: https://YOUR-PROVIDER.example/v1   # replace with your provider's base URL
    model: your-model-name                  # replace with a model your provider serves
    tier: 3
    local: false
    max_concurrency: 16
    cost_per_1k_tokens: 0.002
    prior_s_per_token: 0.01
    api_key_env: CLOUD_API_KEY
